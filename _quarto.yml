project:
  type: website
  output-dir: docs
  # Palette and typography sampled from the institutional logos - see _brand.yml.
  # The revealjs decks pin themselves to the dark variant with `brand-mode: dark`.
  brand: _brand.yml
  render:
    - "*.qmd"
    - "!*.rmd"
    # Retired material from the old MET581 module - see archive/README.md
    - "!archive/"

website:
  title: "Data for Life Sciences 1"
  repo-url: https://github.com/H-Mateus/MET581---Computing-for-Bioinformatics-and-Genetic-Epidemiology
  issue-url: https://github.com/H-Mateus/MET581---Computing-for-Bioinformatics-and-Genetic-Epidemiology/issues/new/choose
  repo-actions: [edit, issue]
  navbar:
    left:
      - href: index.qmd
        text: Home
    right: 
      - icon: github
        href: https://github.com/H-Mateus/MET581---Computing-for-Bioinformatics-and-Genetic-Epidemiology
  sidebar:
    style: "docked"
    search: true
    contents:
      - section: "Introduction to R"
        contents:
          - text: "Slides"
            href: 01_intro_to_r/MET581_lecture_01_slides.qmd
      - section: "Explore R"
        contents:
          - text: "Slides"
            href: 02_explore_r/MET581_lecture_02-Explore-R.qmd
          - text: "Homework"
            href: 02_explore_r/MET581-Lecture-02-Explore-R-Homework.qmd
      - section: "Wrangling Data 1: dplyr"
        contents:
          - text: "Slides"
            href: 03_wrangling_data_1/MET581-Lecture-03-Wrangling-Data-1-dplyr-Slides.qmd
          - text: "Lecture notes"
            href: 03_wrangling_data_1/MET581-Lecture-03-Wrangling-Data-1-dplyr-Lecture-Notes.qmd
          - text: "Homework"
            href: 03_wrangling_data_1/MET581-Lecture-03-Wrangling-Data-1-dplyr-Homework.qmd
      - section: "Wrangling Data 2: tidying, strings and joins"
        contents:
          - text: "Slides"
            href: 04_wrangling_data_2/MET581-Lecture-04-Wrangling-Data-2-strings-slides.qmd
          - text: "Lecture notes"
            href: 04_wrangling_data_2/MET581-Lecture-04-Wrangling-Data-2-strings-Lecture-Notes.qmd
          - text: "Homework"
            href: 04_wrangling_data_2/MET581-Lecture-04-Wrangling-Data-2-strings-Homework.qmd
      - section: "Wrangling Data 3: factors, dates and functions"
        contents:
          - text: "Slides"
            href: 05_wrangling_data_3/MET581-Lecture-05-Wrangling-Data-3-forcats-Slides.qmd
          - text: "Lecture notes"
            href: 05_wrangling_data_3/MET581-Lecture-05-Wrangling-Data-3-forcats-Lecture-Notes.qmd
